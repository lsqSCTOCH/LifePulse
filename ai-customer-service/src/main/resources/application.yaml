server:
  address: 127.0.0.1
  port: 8082
spring:
  application:
    name: ai-customer-service
  ai:
    mcp:
      client:
        enabled: ${MCP_ENABLED:true}
        type: SYNC
        request-timeout: 15s
        streamable-http:
          connections:
            business:
              url: ${MCP_BASE_URL:http://127.0.0.1:8083}
customer-service:
  mock: ${AI_MOCK:true}
  business-url: ${BUSINESS_BASE_URL:http://127.0.0.1:8081}
  ai:
    base-url: ${AI_BASE_URL:https://geekspace.cloud}
    completions-path: /v1/chat/completions
    api-key: ${OPENAI_API_KEY:}
    model: ${AI_MODEL:gpt-5.5}
