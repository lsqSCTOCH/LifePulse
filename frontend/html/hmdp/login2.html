<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号登录 · LifePulse 智享生活平台</title>
  <link href="./css/login.css" rel="stylesheet">
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">

  <style type="text/css">
      .el-radio__input.is-checked .el-radio__inner {
          border-color: #F63;
          background: #F63;
      }
      .el-input__inner:focus {
          border: 1px solid #F63;
      }
  </style>
  <link rel="icon" type="image/svg+xml" href="./imgs/lifepulse-mark.svg">
  <link rel="stylesheet" href="./css/lifepulse.css?v=1">
  <script src="./js/location.js?v=1"></script>
  <script src="./js/lifepulse.js?v=1" defer></script>
</head>
<body class="page-login2">
<div id="app">
  <div class="login-container">
    <div class="header">
      <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
      <div class="header-title">密码登录&nbsp;&nbsp;&nbsp;</div>
    </div>
    <div class="content">
      <div class="login-form"><div class="lp-login-intro"><span class="lp-eyebrow">WELCOME TO LIFEPULSE</span><h1>欢迎回来，<br>生活的探索者。</h1><p>登录后，继续记录你的城市生活。</p></div>
        <el-input placeholder="请输入手机号" v-model="form.phone">
        </el-input>
        <div style="height: 5px"></div>
        <el-input placeholder="请输入密码" v-model="form.password">
        </el-input>
        <div style="text-align: center; color: #8c939d;margin: 5px 0"><a href="javascript:void(0)">忘记密码</a></div>
        <el-button @click="login" style="width: 100%; background-color:#f63; color: #fff;">登录</el-button>
        <div style="text-align: right; color:#333333; margin: 5px 0"><a href="/login.html">验证码登录</a></div>
      </div>
      <div class="login-radio">
        <input class="lp-agreement-checkbox" type="checkbox" id="agreement" v-model="radio">
        <label class="lp-agreement-label" for="agreement">我已阅读并同意
          <a href="javascript:void(0)">
          《LifePulse 智享生活平台用户服务协议》</a>、
          <a href="javascript:void(0)">《隐私政策》</a>
          等，接受免除或者限制责任、诉讼管辖约定等粗体标示条款
        </label>
      </div>
    </div>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      radio: false,
      form:{
      }
    },
    methods: {
      login(){
        if(!this.radio){
          this.$message.error("请先确认阅读用户协议！");
          return;
        }
        axios.post("/user/login", this.form)
          .then(({data}) => {
            if(data){
              // 保存用户信息到session
              sessionStorage.setItem("token", data);
            }
            // 跳转到首页
            location.href = "/info.html"
          })
          .catch(err => this.$message.error(err))
      },
      goBack(){
        history.back();
      }
    }
  })
</script>
</body>
</html>
